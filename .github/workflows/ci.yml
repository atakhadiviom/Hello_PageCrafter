name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python syntax
        run: |
          python -m py_compile __manifest__.py __init__.py models/__init__.py

      - name: Validate XML syntax
        run: |
          python -c "import xml.etree.ElementTree as ET; ET.parse('views/layout.xml')"

      - name: Validate SCSS compilation
        run: |
          npx --yes sass --no-source-map static/src/scss/main.scss /dev/null
